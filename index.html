<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mike Drop">
<meta name="theme-color" content="#f5c842">
<link rel="manifest" href="manifest.json">
<title>Mike Drop</title>

<style>
  /* ── Reset & base ─────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #fdf3c8;
    --wall:     #e8a838;
    --wall-dk:  #c07820;
    --red:      #d63031;
    --txt:      #7a2800;
    --gold:     #e8900a;
    --shadow:   rgba(120,60,0,0.18);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  /* ── Screens ──────────────────────────────────────────────── */
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    transition: opacity .35s ease, transform .35s ease;
  }
  .screen.hidden { opacity: 0; pointer-events: none; transform: scale(.96); }

  /* ── Splash ───────────────────────────────────────────────── */
  #splash {
    background: linear-gradient(160deg, #fdf3c8 0%, #fbc84a 55%, #f59520 100%);
    gap: 0;
  }
  .splash-fruits {
    position: absolute; inset: 0; pointer-events: none; overflow: hidden;
  }
  .splash-fruit {
    position: absolute;
    border-radius: 50%;
    object-fit: cover;
    opacity: 0;
    animation: floatIn .6s ease forwards, bob 2.6s ease-in-out infinite alternate;
  }
  @keyframes floatIn  { to { opacity: .82; } }
  @keyframes bob      { from { transform: translateY(-8px) rotate(-4deg); }
                        to   { transform: translateY( 8px) rotate( 4deg); } }

  .splash-title {
    font-size: clamp(38px, 10vw, 56px);
    font-weight: 900;
    color: var(--txt);
    text-shadow: 0 3px 0 rgba(255,255,255,.7), 0 6px 16px rgba(180,80,0,.25);
    letter-spacing: -1px;
    margin-bottom: 6px;
    animation: popIn .55s cubic-bezier(.34,1.56,.64,1) .1s both;
  }
  .splash-sub {
    font-size: clamp(11px, 3vw, 14px);
    font-weight: 700;
    letter-spacing: 5px;
    color: rgba(120,50,0,.65);
    margin-bottom: 52px;
    animation: popIn .5s cubic-bezier(.34,1.56,.64,1) .25s both;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(.6); }
    to   { opacity: 1; transform: scale(1); }
  }

  .btn-start {
    width: min(320px, 80vw);
    padding: 18px 0;
    border: none; border-radius: 18px;
    background: linear-gradient(135deg, #e84b10, #a81800);
    color: #fff;
    font-size: 20px; font-weight: 900; letter-spacing: 3px;
    box-shadow: 0 8px 24px rgba(180,30,0,.45);
    cursor: pointer;
    animation: popIn .5s cubic-bezier(.34,1.56,.64,1) .4s both;
    transition: transform .15s, box-shadow .15s;
  }
  .btn-start:active { transform: scale(.95); box-shadow: 0 4px 12px rgba(180,30,0,.35); }

  .splash-hint {
    margin-top: 22px;
    font-size: 12px; font-weight: 500;
    color: rgba(120,50,0,.55);
    letter-spacing: 1px;
    animation: popIn .4s ease .65s both;
  }

  /* ── Game screen ──────────────────────────────────────────── */
  #game {
    flex-direction: column;
    justify-content: flex-start;
    padding: env(safe-area-inset-top, 10px) 0 env(safe-area-inset-bottom, 0) 0;
    background: linear-gradient(180deg, #fdf3c8 0%, #fde98a 100%);
  }

  /* HUD */
  #hud {
    width: 100%; display: flex; gap: 10px;
    padding: 8px 14px 6px;
  }
  .hud-box {
    flex: 1; background: rgba(255,255,255,.72);
    border-radius: 14px; padding: 8px 14px;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .hud-label {
    font-size: 9px; font-weight: 800; letter-spacing: 2.5px;
    color: rgba(120,60,0,.55); margin-bottom: 2px;
  }
  .hud-val {
    font-size: 26px; font-weight: 900; color: var(--txt);
    line-height: 1; transition: transform .15s;
  }
  .hud-val.pop { animation: scorePopAnim .25s ease; }
  @keyframes scorePopAnim { 0%,100%{transform:scale(1)} 50%{transform:scale(1.25)} }

  /* Canvas wrapper */
  #canvas-wrap {
    flex: 1; width: 100%;
    display: flex; align-items: stretch;
    padding: 0 12px 10px;
    min-height: 0;
  }
  #gameCanvas {
    width: 100%; height: 100%;
    border-radius: 20px;
    box-shadow: 0 6px 28px var(--shadow);
    display: block;
    background: #fef8e4;
    cursor: none;
    touch-action: none;
  }

  /* ── Next-fruit preview (top-right corner) ─────────────────── */
  #next-box {
    position: absolute; top: 20px; right: 14px;
    background: rgba(255,255,255,.75);
    border-radius: 0 0 14px 14px;
    padding: 4px 10px 8px;
    display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 2px 8px var(--shadow);
    pointer-events: none;
  }
  #next-label { font-size: 9px; font-weight: 800; letter-spacing: 2px; color: rgba(120,60,0,.5); }
  #next-img {
    width: 44px; height: 44px; border-radius: 50%; object-fit: cover;
    margin-top: 4px;
  }

  /* ── Game-over overlay ────────────────────────────────────── */
  #overlay {
    position: absolute; inset: 0;
    background: rgba(40,10,0,.58);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .35s ease;
    z-index: 20;
  }
  #overlay.visible { opacity: 1; pointer-events: all; }
  .over-card {
    background: rgba(80,20,5,.95);
    border-radius: 28px; padding: 36px 32px;
    text-align: center; color: #fff;
    width: min(320px, 88vw);
    box-shadow: 0 16px 48px rgba(0,0,0,.5);
    transform: scale(.9);
    transition: transform .35s cubic-bezier(.34,1.56,.64,1);
  }
  #overlay.visible .over-card { transform: scale(1); }
  .over-melon { font-size: 60px; margin-bottom: 8px; }
  .over-title { font-size: 30px; font-weight: 900; letter-spacing: 2px; }
  .over-score { font-size: 22px; font-weight: 700; color: #fbc84a; margin-top: 8px; }
  .over-best  { font-size: 13px; font-weight: 700; color: #fbc84a;
                background: rgba(255,255,255,.15); border-radius: 20px;
                padding: 4px 14px; display: inline-block; margin-top: 8px; }
  .btn-retry {
    margin-top: 26px; width: 100%;
    padding: 16px 0; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #e84b10, #a81800);
    color: #fff; font-size: 18px; font-weight: 900; letter-spacing: 2px;
    box-shadow: 0 6px 18px rgba(180,30,0,.5);
    cursor: pointer; transition: transform .15s;
  }
  .btn-retry:active { transform: scale(.95); }
  .btn-menu {
    margin-top: 12px; background: none; border: none;
    color: rgba(255,255,255,.65); font-size: 14px; font-weight: 600;
    cursor: pointer; text-decoration: underline;
  }

  /* ── PWA install banner ───────────────────────────────────── */
  #install-banner {
    position: fixed; bottom: calc(env(safe-area-inset-bottom,0px) + 12px);
    left: 50%; transform: translateX(-50%);
    background: rgba(80,20,5,.92);
    color: #fff; font-size: 13px; font-weight: 600;
    padding: 10px 20px; border-radius: 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,.35);
    display: none; align-items: center; gap: 8px;
    z-index: 99; text-align: center;
    white-space: nowrap;
  }
  #install-banner .ib-icon { font-size: 18px; }
  #install-banner .ib-close {
    margin-left: 8px; background: none; border: none;
    color: rgba(255,255,255,.6); font-size: 16px; cursor: pointer;
  }
</style>
</head>

<body>

<!-- ═══════════════════════ SPLASH ═══════════════════════════ -->
<div id="splash" class="screen">
  <div class="splash-fruits" id="splashFruits"></div>
  <div class="splash-title">Mike Drop</div>
  <button class="btn-start" id="btnStart">▶ START GAME</button>
  <div class="splash-hint">Merge • Evolve • Reach the McWatermelon</div>
</div>

<!-- ═══════════════════════ GAME ═════════════════════════════ -->
<div id="game" class="screen hidden">
  <div id="hud">
    <div class="hud-box">
      <div class="hud-label">SCORE</div>
      <div class="hud-val" id="scoreVal">0</div>
    </div>
    <div class="hud-box" style="text-align:right">
      <div class="hud-label">BEST</div>
      <div class="hud-val" id="bestVal" style="color:var(--gold)">0</div>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- next-fruit preview -->
  <div id="next-box">
    <div id="next-label">NEXT</div>
    <img id="next-img" src="" alt="next">
  </div>

  <!-- game-over overlay -->
  <div id="overlay">
    <div class="over-card">
      <div class="over-melon">Huh?</div>
      <div class="over-title">GAME OVER</div>
      <div class="over-score" id="overScore">Score: 0</div>
      <div class="over-best"  id="overBest" style="display:none">🏆 NEW BEST!</div>
      <button class="btn-retry" id="btnRetry">↺ Play Again</button>
      <button class="btn-menu"  id="btnMenu">Main Menu</button>
    </div>
  </div>
</div>

<!-- Matter.js physics -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════
   FRUIT DEFINITIONS
   name, radius (at 390px canvas width), image filename
═══════════════════════════════════════════════════════════════ */
const FRUITS = [
  { name: 'McCherry',      r: 20,  img: '1.jpg'  },
  { name: 'McStrawberry',  r: 28,  img: '2.jpg'  },
  { name: 'McGrape',       r: 37,  img: '3.jpg'  },
  { name: 'McOrange',      r: 47,  img: '4.jpg'  },
  { name: 'McLemon',       r: 56,  img: '5.jpg'  },
  { name: 'McApple',       r: 66,  img: '6.jpg'  },
  { name: 'McPear',        r: 76,  img: '7.jpg'  },
  { name: 'McPeach',       r: 87,  img: '8.jpg'  },
  { name: 'McPineapple',   r: 99,  img: '9.jpg'  },
  { name: 'McCoconut',     r: 112, img: '10.jpg' },
  { name: 'McWatermelon',  r: 128, img: '11.jpg' },
];

const COLORS = [
  '#f26c6c','#e03055','#8b3fa8','#ff8800','#ffd700',
  '#e51c1c','#bfc832','#ff9966','#f5c518','#8B4513','#3aab3a'
];

const SCORE_PER_MERGE = [1, 3, 6, 10, 15, 21, 28, 36, 45, 55, 100];
const BASE_W = 390; // reference canvas width for radius scaling

/* ═══════════════════════════════════════════════════════════════
   IMAGE CACHE
═══════════════════════════════════════════════════════════════ */
const imgCache = {};
let imagesLoaded = 0;

function loadImages(cb) {
  FRUITS.forEach((f, i) => {
    const im = new Image();
    im.onload  = () => { imagesLoaded++; if (imagesLoaded === FRUITS.length) cb(); };
    im.onerror = () => { imagesLoaded++; if (imagesLoaded === FRUITS.length) cb(); };
    im.src = `images/${f.img}`;
    imgCache[i] = im;
  });
}

/* ═══════════════════════════════════════════════════════════════
   SPLASH
═══════════════════════════════════════════════════════════════ */
const splashPositions = [
  {idx:0,  s:44, x:.12, y:.18, delay:.0},
  {idx:2,  s:52, x:.82, y:.14, delay:.10},
  {idx:4,  s:58, x:.22, y:.62, delay:.20},
  {idx:6,  s:66, x:.78, y:.58, delay:.05},
  {idx:1,  s:48, x:.50, y:.10, delay:.15},
  {idx:3,  s:56, x:.88, y:.38, delay:.25},
  {idx:5,  s:64, x:.08, y:.42, delay:.30},
  {idx:8,  s:72, x:.62, y:.72, delay:.12},
  {idx:10, s:100,x:.38, y:.80, delay:.35},
];

function buildSplash() {
  const wrap = document.getElementById('splashFruits');
  splashPositions.forEach((p, i) => {
    const img = new Image();
    img.src = `images/${FRUITS[p.idx].img}`;
    img.style.cssText = `
      width:${p.s}px; height:${p.s}px;
      left:${p.x*100}%; top:${p.y*100}%;
      transform: translate(-50%,-50%);
      animation-delay: ${p.delay}s, ${p.delay + .6}s;
      animation-duration: .6s, ${1.8 + p.delay*1.5}s;
    `;
    img.className = 'splash-fruit';
    wrap.appendChild(img);
  });
}

/* ═══════════════════════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════════════════════ */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.toggle('hidden', s.id !== id);
  });
}

document.getElementById('btnStart').addEventListener('click', () => {
  showScreen('game');
  startGame();
});
document.getElementById('btnRetry').addEventListener('click', () => {
  document.getElementById('overlay').classList.remove('visible');
  startGame();
});
document.getElementById('btnMenu').addEventListener('click', () => {
  document.getElementById('overlay').classList.remove('visible');
  stopEngine();
  showScreen('splash');
});

/* ═══════════════════════════════════════════════════════════════
   PHYSICS ENGINE  (Matter.js)
═══════════════════════════════════════════════════════════════ */
const { Engine, Render, Runner, Bodies, Body, World, Events, Vector } = Matter;

let engine, world, runner;
let fruits = [];          // { body, level, merging, img }
let particles = [];       // merge burst particles
let dropX = 0;
let nextLevel = 0;
let score = 0;
let best = +localStorage.getItem('best') || 0;
let canDrop = true;
let isMidDrop = false;
let gameOver = false;
let animId;

// Canvas
const canvas  = document.getElementById('gameCanvas');
const ctx     = canvas.getContext('2d');

// Wall thickness (logical, scaled below)
const WALL = 16;
const DROP_Y_FRAC  = 0.14;  // fraction of canvas height for drop line
const DANGER_FRAC  = 0.17;  // fraction for danger line

let CW, CH, scale;  // set in resize()

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  CW = wrap.clientWidth  - 24;   // minus 2×12px padding
  CH = wrap.clientHeight - 10;
  canvas.width  = CW;
  canvas.height = CH;
  scale = CW / BASE_W;
  dropX = CW / 2;
}

/* ── Wall bodies ─────────────────────────────────────────────── */
function buildWalls() {
  const opts = { isStatic: true, restitution: 0.05, friction: 0.55,
                 render: { fillStyle: '#e8a838' } };
  const floor = Bodies.rectangle(CW/2, CH + WALL/2, CW, WALL, opts);
  const left  = Bodies.rectangle(-WALL/2, CH/2, WALL, CH*2, opts);
  const right = Bodies.rectangle(CW + WALL/2, CH/2, WALL, CH*2, opts);
  World.add(world, [floor, left, right]);
}

/* ── Fruit radius (scaled) ───────────────────────────────────── */
function scaledR(level) {
  return FRUITS[level].r * scale;
}

/* ── Drop weight pool ────────────────────────────────────────── */
const WEIGHTS = [35,28,20,12,5,0,0,0,0,0,0];
function pickLevel() {
  const pool = [];
  WEIGHTS.forEach((w,i) => { for(let j=0;j<w;j++) pool.push(i); });
  return pool[Math.floor(Math.random() * pool.length)];
}

/* ── Spawn a fruit body ──────────────────────────────────────── */
function spawnFruit(x, y, level, isPreview = false) {
  const r    = scaledR(level);
  const body = Bodies.circle(x, y, r * 0.97, {
    restitution:   0.08,
    friction:      0.55,
    frictionAir:   0.008,
    density:       0.004,
    label:         `fruit_${level}`,
    isStatic:      isPreview,
    collisionFilter: isPreview
      ? { mask: 0 }   // preview collides with nothing
      : { category: 0x0001, mask: 0x0001 | 0x0002 }
  });
  body._level   = level;
  body._merging = false;
  World.add(world, body);
  return body;
}

/* ═══════════════════════════════════════════════════════════════
   GAME STATE
═══════════════════════════════════════════════════════════════ */
let previewBody = null;

function startGame() {
  stopEngine();
  resize();

  score     = 0;
  fruits    = [];
  particles = [];
  canDrop   = true;
  isMidDrop = false;
  gameOver  = false;

  updateHUD();

  engine = Engine.create({ gravity: { x: 0, y: 2.2 } });
  world  = engine.world;
  runner = Runner.create();

  buildWalls();

  nextLevel   = pickLevel();
  previewBody = spawnFruit(dropX, CH * DROP_Y_FRAC, nextLevel, true);

  updateNextPreview();
  Events.on(engine, 'collisionStart', onCollision);

  Runner.run(runner, engine);
  animId = requestAnimationFrame(loop);
}

function stopEngine() {
  if (runner) { Runner.stop(runner); runner = null; }
  if (engine) { Engine.clear(engine); engine = null; world = null; }
  if (animId) { cancelAnimationFrame(animId); animId = null; }
}

/* ═══════════════════════════════════════════════════════════════
   COLLISION → MERGE
═══════════════════════════════════════════════════════════════ */
function onCollision(evt) {
  if (gameOver) return;
  evt.pairs.forEach(pair => {
    const a = pair.bodyA, b = pair.bodyB;
    if (a._level === undefined || b._level === undefined) return;
    if (a._level !== b._level) return;
    if (a._merging || b._merging) return;
    a._merging = b._merging = true;

    const level = a._level;
    const mx = (a.position.x + b.position.x) / 2;
    const my = (a.position.y + b.position.y) / 2;

    setTimeout(() => {
      if (!world) return;
      World.remove(world, a);
      World.remove(world, b);
      fruits = fruits.filter(f => f.body !== a && f.body !== b);

      spawnMergeParticles(mx, my, level);
      addScore(SCORE_PER_MERGE[Math.min(level, SCORE_PER_MERGE.length-1)]);

      if (level < FRUITS.length - 1) {
        const nb = spawnFruit(mx, my, level + 1);
        fruits.push({ body: nb, level: level + 1 });
        // tiny pop impulse
        const r = scaledR(level + 1);
        Body.applyForce(nb, nb.position, {
          x: (Math.random() - .5) * r * 0.0004,
          y: -r * 0.0006
        });
      }
    }, 40);
  });
}

/* ═══════════════════════════════════════════════════════════════
   MERGE BURST PARTICLES
═══════════════════════════════════════════════════════════════ */
function spawnMergeParticles(x, y, level) {
  const count = 12 + level * 2;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.2 + Math.random() * 2.8;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r:  3 + Math.random() * 5,
      life: 1,
      decay: .03 + Math.random() * .03,
      color: ['#ffd700','#ff8800','#ff4400'][Math.floor(Math.random()*3)]
    });
  }
}

/* ═══════════════════════════════════════════════════════════════
   INPUT  (touch + mouse)
═══════════════════════════════════════════════════════════════ */
function clampX(x) {
  const r = scaledR(nextLevel);
  return Math.max(WALL + r + 2, Math.min(CW - WALL - r - 2, x));
}

function getCanvasX(clientX) {
  const rect = canvas.getBoundingClientRect();
  return (clientX - rect.left) * (CW / rect.width);
}

function onMove(cx) {
  if (gameOver || isMidDrop) return;
  dropX = clampX(getCanvasX(cx));
  if (previewBody) Body.setPosition(previewBody, { x: dropX, y: CH * DROP_Y_FRAC });
}

function onDrop(cx) {
  if (gameOver || !canDrop || isMidDrop) return;
  dropX    = clampX(getCanvasX(cx));
  isMidDrop = true;
  canDrop   = false;

  // Convert preview into a real fruit
  if (previewBody) {
    World.remove(world, previewBody);
    previewBody = null;
  }
  const level = nextLevel;
  const nb = spawnFruit(dropX, CH * DROP_Y_FRAC, level, false);
  fruits.push({ body: nb, level });

  // downward nudge
  Body.applyForce(nb, nb.position, { x: 0, y: scaledR(level) * 0.003 });

  // prepare next
  nextLevel   = pickLevel();
  updateNextPreview();

  setTimeout(() => {
    if (!world) return;
    previewBody = spawnFruit(dropX, CH * DROP_Y_FRAC, nextLevel, true);
    canDrop   = true;
    isMidDrop = false;
  }, 650);
}

// Touch
canvas.addEventListener('touchmove',  e => { e.preventDefault(); onMove(e.touches[0].clientX); }, { passive:false });
canvas.addEventListener('touchend',   e => { e.preventDefault(); onDrop(e.changedTouches[0].clientX); }, { passive:false });
// Mouse (desktop testing)
canvas.addEventListener('mousemove',  e => onMove(e.clientX));
canvas.addEventListener('click',      e => onDrop(e.clientX));

/* ═══════════════════════════════════════════════════════════════
   HUD
═══════════════════════════════════════════════════════════════ */
function updateHUD() {
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('bestVal').textContent  = best;
}

function addScore(pts) {
  score += pts;
  if (score > best) { best = score; localStorage.setItem('best', best); }
  updateHUD();
  const el = document.getElementById('scoreVal');
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
}

function updateNextPreview() {
  const img = document.getElementById('next-img');
  img.src = `images/${FRUITS[nextLevel].img}`;
}

/* ═══════════════════════════════════════════════════════════════
   RENDER LOOP
═══════════════════════════════════════════════════════════════ */
function loop() {
  animId = requestAnimationFrame(loop);
  drawFrame();
}

// Pre-draw circular clip paths for each fruit image
const circleClips = {};

function drawFrame() {
  ctx.clearRect(0, 0, CW, CH);

  // ── Background
  ctx.fillStyle = '#fef8e4';
  ctx.fillRect(0, 0, CW, CH);

  // ── Walls (visual only — physics walls are invisible bodies)
  ctx.fillStyle = 'rgba(232,168,56,.65)';
  ctx.strokeStyle = '#c07820';
  ctx.lineWidth = 1.5;
  // floor
  roundRect(ctx, WALL, CH - WALL, CW - WALL*2, WALL, 4);
  ctx.fill(); ctx.stroke();
  // left
  roundRect(ctx, 0, 0, WALL, CH, [0,0,6,6]);
  ctx.fill(); ctx.stroke();
  // right
  roundRect(ctx, CW - WALL, 0, WALL, CH, [0,0,6,6]);
  ctx.fill(); ctx.stroke();

  // ── Danger line
  const dangerY = CH * DANGER_FRAC;
  ctx.setLineDash([8,5]);
  ctx.strokeStyle = 'rgba(214,48,49,.45)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(WALL, dangerY); ctx.lineTo(CW-WALL, dangerY);
  ctx.stroke();
  ctx.setLineDash([]);

  // ── Drop guide line
  if (!gameOver && previewBody) {
    const gx = previewBody.position.x;
    ctx.setLineDash([5,5]);
    ctx.strokeStyle = 'rgba(255,255,255,.3)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(gx, dangerY + 2); ctx.lineTo(gx, CH - WALL);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // ── Fruits (physics + preview)
  const allBodies = [...fruits.map(f=>({body:f.body,level:f.level,alpha:1}))];
  if (previewBody && previewBody._level !== undefined) {
    allBodies.push({ body: previewBody, level: previewBody._level, alpha: .72 });
  }

  allBodies.forEach(({ body, level, alpha }) => {
    const { x, y } = body.position;
    const r = scaledR(level);
    const angle = body.angle;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.rotate(angle);

    // Circular clip
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI*2);
    ctx.clip();

    const im = imgCache[level];
    if (im && im.complete && im.naturalWidth > 0) {
      ctx.drawImage(im, -r, -r, r*2, r*2);
    } else {
      // Fallback coloured circle
      ctx.fillStyle = COLORS[level];
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${r*.8}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(level+1, 0, 0);
    }

    // Rim highlight
    ctx.restore();
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = alpha * .4;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  });

  // ── Merge particles
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vy += .08;  // gravity on particles
    p.life -= p.decay;
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });

  // ── Game-over check
  if (!gameOver) checkGameOver();
}

/* ─── Helper: rounded rect ──────────────────────────────────── */
function roundRect(ctx, x, y, w, h, r) {
  const rad = typeof r === 'number' ? [r,r,r,r] : r;
  ctx.beginPath();
  ctx.moveTo(x + rad[0], y);
  ctx.lineTo(x + w - rad[1], y); ctx.arcTo(x+w,y, x+w,y+rad[1], rad[1]);
  ctx.lineTo(x + w, y + h - rad[2]); ctx.arcTo(x+w,y+h, x+w-rad[2],y+h, rad[2]);
  ctx.lineTo(x + rad[3], y + h); ctx.arcTo(x,y+h, x,y+h-rad[3], rad[3]);
  ctx.lineTo(x, y + rad[0]); ctx.arcTo(x,y, x+rad[0],y, rad[0]);
  ctx.closePath();
}

/* ═══════════════════════════════════════════════════════════════
   GAME-OVER CHECK
═══════════════════════════════════════════════════════════════ */
function checkGameOver() {
  if (!engine) return;
  const dangerY = CH * DANGER_FRAC;
  for (const { body } of fruits) {
    if (body._merging) continue;
    const vel = body.velocity;
    const speed = Math.hypot(vel.x, vel.y);
    if (body.position.y < dangerY && speed < .3) {
      triggerGameOver();
      return;
    }
  }
}

function triggerGameOver() {
  gameOver = true;
  canDrop  = false;
  if (runner) Runner.stop(runner);

  const isNew = score >= best && score > 0;
  document.getElementById('overScore').textContent = `Score: ${score}`;
  document.getElementById('overBest').style.display = isNew ? 'inline-block' : 'none';
  setTimeout(() => {
    document.getElementById('overlay').classList.add('visible');
  }, 600);
}
