<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mike Drop">
<meta name="theme-color" content="#f5c842">
<link rel="manifest" href="manifest.json">
<title>Mike Drop</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --txt:    #7a2800;
  --gold:   #e8900a;
  --shadow: rgba(120,60,0,.18);
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #fdf3c8;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* ════════════════════════════════════
   SCREENS
════════════════════════════════════ */
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: opacity .3s ease, transform .3s ease;
}
.screen.hidden {
  opacity: 0; pointer-events: none; transform: scale(.97);
}

/* ════════════════════════════════════
   SPLASH
════════════════════════════════════ */
#splash {
  background: linear-gradient(155deg, #fdf3c8 0%, #fbc84a 55%, #f59520 100%);
}

.splash-deco {
  position: absolute; inset: 0;
  pointer-events: none; overflow: hidden;
}
.splash-deco img {
  position: absolute;
  border-radius: 50%;
  object-fit: cover;
  opacity: 0;
  animation: fadeIn .5s ease forwards, bob 2.4s ease-in-out infinite alternate;
}
@keyframes fadeIn { to { opacity: .8; } }
@keyframes bob {
  from { transform: translate(-50%,-50%) translateY(-9px) rotate(-5deg); }
  to   { transform: translate(-50%,-50%) translateY( 9px) rotate( 5deg); }
}

.splash-title {
  position: relative; z-index: 2;
  font-size: clamp(40px, 11vw, 60px);
  font-weight: 900;
  color: var(--txt);
  text-shadow: 0 3px 0 rgba(255,255,255,.7), 0 6px 18px rgba(180,80,0,.25);
  letter-spacing: -1px;
  margin-bottom: 8px;
  animation: popIn .5s cubic-bezier(.34,1.56,.64,1) .1s both;
}
.splash-sub {
  position: relative; z-index: 2;
  font-size: clamp(10px, 3vw, 13px);
  font-weight: 700; letter-spacing: 5px;
  color: rgba(120,50,0,.6);
  margin-bottom: 56px;
  animation: popIn .5s cubic-bezier(.34,1.56,.64,1) .22s both;
}
@keyframes popIn {
  from { opacity: 0; transform: scale(.55); }
  to   { opacity: 1; transform: scale(1); }
}

.btn-start {
  position: relative; z-index: 2;
  width: min(300px, 78vw);
  padding: 18px 0;
  border: none; border-radius: 18px;
  background: linear-gradient(135deg, #e84b10, #a81800);
  color: #fff;
  font-size: 19px; font-weight: 900; letter-spacing: 3px;
  box-shadow: 0 8px 24px rgba(180,30,0,.45);
  cursor: pointer;
  animation: popIn .5s cubic-bezier(.34,1.56,.64,1) .38s both;
  transition: transform .12s, box-shadow .12s;
}
.btn-start:active { transform: scale(.95); box-shadow: 0 4px 12px rgba(180,30,0,.35); }

.splash-hint {
  position: relative; z-index: 2;
  margin-top: 20px;
  font-size: 12px; font-weight: 500;
  color: rgba(120,50,0,.5); letter-spacing: 1px;
  animation: popIn .4s ease .55s both;
}

/* ════════════════════════════════════
   GAME SCREEN
════════════════════════════════════ */
#game {
  flex-direction: column;
  justify-content: flex-start;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: linear-gradient(180deg, #fdf3c8 0%, #fde98a 100%);
}

/* HUD */
#hud {
  flex-shrink: 0;
  width: 100%; display: flex; gap: 10px;
  padding: 8px 14px 6px;
}
.hud-box {
  flex: 1;
  background: rgba(255,255,255,.72);
  border-radius: 14px; padding: 7px 14px;
  box-shadow: 0 2px 8px var(--shadow);
}
.hud-label {
  font-size: 9px; font-weight: 800; letter-spacing: 2.5px;
  color: rgba(120,60,0,.5); margin-bottom: 1px;
}
.hud-val {
  font-size: 26px; font-weight: 900; color: var(--txt); line-height: 1;
}
.hud-val.gold { color: var(--gold); }
.hud-val.pop  { animation: scorePop .22s ease; }
@keyframes scorePop { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }

/* Canvas area */
#canvas-wrap {
  flex: 1; min-height: 0;
  width: 100%;
  padding: 0 12px 10px;
  display: flex;
}
#c {
  flex: 1; display: block;
  border-radius: 20px;
  box-shadow: 0 6px 28px var(--shadow);
  touch-action: none;
  /* actual pixel size set by JS */
}

/* ════════════════════════════════════
   GAME-OVER OVERLAY
════════════════════════════════════ */
#overlay {
  position: absolute; inset: 0; z-index: 20;
  background: rgba(30,8,0,.58);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity .3s ease;
}
#overlay.on { opacity: 1; pointer-events: all; }

.card {
  background: rgba(72,16,3,.96);
  border-radius: 28px; padding: 36px 32px;
  text-align: center; color: #fff;
  width: min(310px, 86vw);
  box-shadow: 0 16px 48px rgba(0,0,0,.55);
  transform: scale(.88);
  transition: transform .35s cubic-bezier(.34,1.56,.64,1);
}
#overlay.on .card { transform: scale(1); }

.card-emoji  { font-size: 56px; }
.card-title  { font-size: 28px; font-weight: 900; letter-spacing: 2px; margin-top: 6px; }
.card-score  { font-size: 20px; font-weight: 700; color: #fbc84a; margin-top: 6px; }
.card-best   {
  font-size: 12px; font-weight: 700; color: #ffd700;
  background: rgba(255,255,255,.15); border-radius: 20px;
  padding: 3px 14px; margin-top: 8px; display: none;
}
.btn-retry {
  margin-top: 24px; width: 100%;
  padding: 15px 0; border: none; border-radius: 14px;
  background: linear-gradient(135deg,#e84b10,#a81800);
  color: #fff; font-size: 17px; font-weight: 900; letter-spacing: 2px;
  box-shadow: 0 6px 18px rgba(180,30,0,.5);
  cursor: pointer; transition: transform .12s;
}
.btn-retry:active { transform: scale(.95); }
.btn-menu {
  margin-top: 12px; background: none; border: none;
  color: rgba(255,255,255,.55); font-size: 14px; font-weight: 600;
  cursor: pointer; text-decoration: underline; display: block; width: 100%;
}
</style>
</head>
<body>

<!-- ══════════ SPLASH ══════════ -->
<div id="splash" class="screen">
  <div class="splash-deco" id="splashDeco"></div>
  <div class="splash-title">Mike Drop</div>
  <div class="splash-sub">MERGE · EVOLVE · DROP</div>
  <button class="btn-start" id="btnStart">▶  START GAME</button>
  <div class="splash-hint">Reach the McWatermelon!</div>
</div>

<!-- ══════════ GAME ══════════ -->
<div id="game" class="screen hidden">
  <div id="hud">
    <div class="hud-box">
      <div class="hud-label">SCORE</div>
      <div class="hud-val" id="sScore">0</div>
    </div>
    <div class="hud-box" style="text-align:right">
      <div class="hud-label">BEST</div>
      <div class="hud-val gold" id="sBest">0</div>
    </div>
  </div>
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
  </div>
</div>

<!-- ══════════ GAME-OVER ══════════ -->
<div id="overlay">
  <div class="card">
    <div class="card-emoji">😵</div>
    <div class="card-title">GAME OVER</div>
    <div class="card-score" id="oScore">Score: 0</div>
    <div class="card-best"  id="oBest">🏆 NEW BEST!</div>
    <button class="btn-retry" id="btnRetry">↺  再来一局</button>
    <button class="btn-menu"  id="btnMenu">回主页</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
'use strict';

/* ══════════════════════════════════════════════════════
   FRUIT TABLE
   r       = base radius at 390 px canvas width
   density = matter.js density; scales with r^2.2
             so bigger fruits are proportionally heavier
══════════════════════════════════════════════════════ */
const FRUITS = [
  { name:'McCherry',     r:18,  density:0.0006, color:'#f26c6c', img:'1'  },
  { name:'McStrawberry', r:25,  density:0.0010, color:'#e03055', img:'2'  },
  { name:'McGrape',      r:33,  density:0.0016, color:'#8b3fa8', img:'3'  },
  { name:'McOrange',     r:42,  density:0.0024, color:'#ff8800', img:'4'  },
  { name:'McLemon',      r:50,  density:0.0034, color:'#ffd700', img:'5'  },
  { name:'McApple',      r:59,  density:0.0047, color:'#e51c1c', img:'6'  },
  { name:'McPear',       r:68,  density:0.0063, color:'#8db828', img:'7'  },
  { name:'McPeach',      r:78,  density:0.0082, color:'#ff9966', img:'8'  },
  { name:'McPineapple',  r:89,  density:0.0106, color:'#f5c518', img:'9'  },
  { name:'McCoconut',    r:101, density:0.0135, color:'#8B4513', img:'10' },
  { name:'McWatermelon', r:115, density:0.0170, color:'#3aab3a', img:'11' },
];

const SCORE_PER_MERGE  = [1, 3, 6, 10, 15, 21, 28, 36, 45, 55, 100];
const DROP_WEIGHTS     = [35, 28, 20, 12, 5]; // only levels 0-4 can be dropped
const BASE_W           = 390;
const WALL_T           = 15;   // wall thickness (px at CSS size)
const DROP_FRAC        = 0.05; // drop-line y = CH * DROP_FRAC
const DANGER_FRAC      = 0.08; // game-over line y = CH * DANGER_FRAC

/* ══════════════════════════════════════════════════════
   IMAGE LOADER
   Tries both .jpg and .png so either extension works.
   Uses a plain <img> tag — the most reliable way on
   mobile Safari regardless of CORS headers.
══════════════════════════════════════════════════════ */
const imgCache = new Array(FRUITS.length).fill(null);

function loadImages() {
  return new Promise(resolve => {
    let done = 0;
    const total = FRUITS.length;
    const exts  = ['jpg','JPG','jpeg','png','PNG'];

    function tryNext(i, extIdx) {
      if (extIdx >= exts.length) {
        // all extensions failed — leave cache[i] null (fallback colour)
        done++;
        if (done === total) resolve();
        return;
      }
      const im  = new Image();
      const src = `images/${FRUITS[i].img}.${exts[extIdx]}`;
      im.onload = () => {
        imgCache[i] = im;
        done++;
        if (done === total) resolve();
      };
      im.onerror = () => tryNext(i, extIdx + 1);
      im.src = src;
    }

    FRUITS.forEach((_, i) => tryNext(i, 0));
  });
}

/* ══════════════════════════════════════════════════════
   SPLASH DECORATION
   Placed after images load so src is known-good.
══════════════════════════════════════════════════════ */
const DECO = [
  {i:0,  s:44,  x:12,  y:18,  delay:0.00},
  {i:2,  s:52,  x:82,  y:13,  delay:0.10},
  {i:4,  s:58,  x:22,  y:63,  delay:0.20},
  {i:6,  s:66,  x:78,  y:57,  delay:0.05},
  {i:1,  s:48,  x:50,  y:10,  delay:0.15},
  {i:3,  s:56,  x:88,  y:38,  delay:0.25},
  {i:5,  s:64,  x:8,   y:42,  delay:0.30},
  {i:8,  s:72,  x:62,  y:73,  delay:0.12},
  {i:10, s:100, x:38,  y:82,  delay:0.35},
];

function buildSplash() {
  const wrap = document.getElementById('splashDeco');
  DECO.forEach(d => {
    const im  = imgCache[d.i];
    const el  = im ? document.createElement('img') : document.createElement('div');
    if (im) {
      el.src = im.src;
    } else {
      // fallback: coloured circle
      el.style.background = FRUITS[d.i].color;
    }
    el.style.cssText = `
      width:${d.s}px; height:${d.s}px;
      left:${d.x}%; top:${d.y}%;
      animation-delay:${d.delay}s, ${d.delay + 0.5}s;
      animation-duration:.5s, ${1.9 + d.delay * 1.4}s;
    `;
    el.className = '';   // reset
    el.setAttribute('style', el.style.cssText);
    // add the CSS classes after setting inline style
    el.style.position   = 'absolute';
    el.style.borderRadius = '50%';
    el.style.objectFit  = 'cover';
    el.style.opacity    = '0';
    el.style.animationName      = 'fadeIn, bob';
    el.style.animationFillMode  = 'forwards, none';
    el.style.animationDelay     = `${d.delay}s, ${d.delay + 0.5}s`;
    el.style.animationDuration  = `.5s, ${1.9 + d.delay*1.4}s`;
    el.style.animationIterationCount = '1, infinite';
    el.style.animationDirection = 'normal, alternate';
    el.style.animationTimingFunction = 'ease, ease-in-out';
    wrap.appendChild(el);
  });
}

/* ══════════════════════════════════════════════════════
   SCREEN NAVIGATION
══════════════════════════════════════════════════════ */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s =>
    s.classList.toggle('hidden', s.id !== id)
  );
}

document.getElementById('btnStart').addEventListener('click', () => {
  showScreen('game');
  startGame();
});
document.getElementById('btnRetry').addEventListener('click', () => {
  document.getElementById('overlay').classList.remove('on');
  startGame();
});
document.getElementById('btnMenu').addEventListener('click', () => {
  document.getElementById('overlay').classList.remove('on');
  stopGame();
  showScreen('splash');
});

/* ══════════════════════════════════════════════════════
   MATTER.JS
══════════════════════════════════════════════════════ */
const { Engine, Runner, Bodies, Body, World, Events } = Matter;

/* ══════════════════════════════════════════════════════
   CANVAS
══════════════════════════════════════════════════════ */
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let CW, CH, scale, dpr;

function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  dpr  = Math.min(window.devicePixelRatio || 1, 2); // cap at 2× for perf
  const cssW = wrap.clientWidth  - 24;
  const cssH = wrap.clientHeight - 10;
  canvas.style.width  = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width  = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
  CW    = cssW;
  CH    = cssH;
  scale = CW / BASE_W;
}

function scaledR(lvl) {
  return FRUITS[Math.min(lvl, FRUITS.length - 1)].r * scale;
}

/* ══════════════════════════════════════════════════════
   GAME STATE
══════════════════════════════════════════════════════ */
let engine, world, runner, rafId, goTimer;
let fruits      = [];  // { body, level }
let particles   = [];
let previewBody = null;
let nextLevel   = 0;
let dropX       = 0;
let score       = 0;
let best        = +localStorage.getItem('mdBest') || 0;
let canDrop     = true;
let midDrop     = false;
let gameOver    = false;

function pickLevel() {
  const pool = [];
  DROP_WEIGHTS.forEach((w, i) => { for (let j = 0; j < w; j++) pool.push(i); });
  return pool[Math.floor(Math.random() * pool.length)];
}

/* ── Build a physics circle ────────────────────────── */
function makeBody(x, y, lvl, preview) {
  const r    = FRUITS[Math.min(lvl, FRUITS.length-1)].r * scale;
  const body = Bodies.circle(x, y, r * 0.98, {
    restitution : 0.10,
    friction    : 0.60,
    frictionAir : 0.006,
    density     : FRUITS[Math.min(lvl, FRUITS.length-1)].density,
    isStatic    : preview,
    collisionFilter: preview
      ? { category:0x0002, mask:0x0000 }          // preview: ghost
      : { category:0x0001, mask:0x0001|0x0004 },  // fruit ↔ fruit + walls
  });
  body._lvl     = lvl;
  body._merging = false;
  World.add(world, body);
  return body;
}

/* ── Static walls ──────────────────────────────────── */
function buildWalls() {
  const wo = {
    isStatic:true, restitution:0.05, friction:0.60,
    collisionFilter:{ category:0x0004, mask:0x0001 },
  };
  World.add(world, [
    Bodies.rectangle(CW/2,  CH + WALL_T/2,     CW + WALL_T*4, WALL_T,   wo), // floor
    Bodies.rectangle(-WALL_T/2,   CH/2, WALL_T, CH*4,  wo), // left
    Bodies.rectangle(CW+WALL_T/2, CH/2, WALL_T, CH*4,  wo), // right
  ]);
}

/* ── Collision → merge ─────────────────────────────── */
function onCollision(evt) {
  if (gameOver) return;
  for (const pair of evt.pairs) {
    const a = pair.bodyA, b = pair.bodyB;
    if (a._lvl === undefined || b._lvl === undefined) continue;
    if (a._lvl !== b._lvl) continue;
    if (a._merging || b._merging) continue;
    a._merging = b._merging = true;

    const lvl = a._lvl;
    const mx  = (a.position.x + b.position.x) / 2;
    const my  = (a.position.y + b.position.y) / 2;

    setTimeout(() => {
      if (!world) return;
      World.remove(world, [a, b]);
      fruits = fruits.filter(f => f.body !== a && f.body !== b);

      burst(mx, my, lvl);
      addScore(SCORE_PER_MERGE[Math.min(lvl, SCORE_PER_MERGE.length - 1)]);

      // Max level (watermelon) → just remove both, no new fruit
      if (lvl >= FRUITS.length - 1) return;

      const nb = makeBody(mx, my, lvl + 1, false);
      fruits.push({ body:nb, level:lvl + 1 });

      // small upward pop
      const rn = FRUITS[lvl+1].r * scale;
      Body.applyForce(nb, nb.position, {
        x: (Math.random() - 0.5) * rn * 0.0002,
        y: -rn * 0.0006,
      });
    }, 35);
  }
}

/* ── Drop ──────────────────────────────────────────── */
function clampDrop(x) {
  const r = scaledR(nextLevel);
  return Math.max(WALL_T + r + 1, Math.min(CW - WALL_T - r - 1, x));
}

function toCanvasX(clientX) {
  const rect = canvas.getBoundingClientRect();
  return (clientX - rect.left) * (CW / rect.width);
}

function onMove(clientX) {
  if (gameOver || midDrop) return;
  dropX = clampDrop(toCanvasX(clientX));
  if (previewBody) Body.setPosition(previewBody, { x:dropX, y:CH * DROP_FRAC });
}

function onDrop(clientX) {
  if (gameOver || !canDrop || midDrop) return;
  midDrop = true; canDrop = false;

  const x   = clampDrop(toCanvasX(clientX));
  const lvl = nextLevel;

  if (previewBody) { World.remove(world, previewBody); previewBody = null; }

  const nb = makeBody(x, CH * DROP_FRAC, lvl, false);
  fruits.push({ body:nb, level:lvl });
  // downward nudge
  Body.applyForce(nb, nb.position, { x:0, y: FRUITS[lvl].r * scale * 0.0022 });

  nextLevel = pickLevel();

  setTimeout(() => {
    if (!world) return;
    dropX       = x;
    previewBody = makeBody(clampDrop(x), CH * DROP_FRAC, nextLevel, true);
    canDrop  = true;
    midDrop  = false;
  }, 580);
}

canvas.addEventListener('touchmove',  e => { e.preventDefault(); onMove(e.touches[0].clientX); }, {passive:false});
canvas.addEventListener('touchend',   e => { e.preventDefault(); onDrop(e.changedTouches[0].clientX); }, {passive:false});
canvas.addEventListener('mousemove',  e => onMove(e.clientX));
canvas.addEventListener('click',      e => onDrop(e.clientX));

/* ══════════════════════════════════════════════════════
   PARTICLES
══════════════════════════════════════════════════════ */
function burst(x, y, lvl) {
  const n = 10 + lvl * 2;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 0.8 + Math.random() * 2.8;
    particles.push({
      x, y,
      vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      r: 2 + Math.random() * 4.5,
      life: 1,
      decay: 0.025 + Math.random() * 0.028,
      color: ['#ffd700','#ff8800','#ff4400'][Math.floor(Math.random()*3)],
    });
  }
}

/* ══════════════════════════════════════════════════════
   HUD
══════════════════════════════════════════════════════ */
function addScore(pts) {
  score += pts;
  if (score > best) { best = score; localStorage.setItem('mdBest', best); }
  document.getElementById('sScore').textContent = score;
  document.getElementById('sBest').textContent  = best;
  const el = document.getElementById('sScore');
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
}

/* ══════════════════════════════════════════════════════
   DRAW FRAME
══════════════════════════════════════════════════════ */
function draw() {
  ctx.clearRect(0, 0, CW, CH);

  // Background
  ctx.fillStyle = '#fef8e4';
  ctx.beginPath(); ctx.roundRect(0, 0, CW, CH, 20); ctx.fill();

  // Walls (visual)
  ctx.fillStyle   = 'rgba(232,168,56,.68)';
  ctx.strokeStyle = '#c07820';
  ctx.lineWidth   = 1.5;
  ctx.beginPath(); ctx.roundRect(0,          0,       WALL_T,        CH,     [0,0,6,6]); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.roundRect(CW - WALL_T, 0,      WALL_T,        CH,     [0,0,6,6]); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.roundRect(WALL_T,      CH-WALL_T, CW-WALL_T*2, WALL_T, 4);        ctx.fill(); ctx.stroke();

  // ── DANGER / GAME-OVER LINE at top ──────────────────
  const dangerY = CH * DANGER_FRAC;
  ctx.save();
  ctx.setLineDash([7, 5]);
  ctx.strokeStyle = 'rgba(214,48,49,.55)';
  ctx.lineWidth   = 2;
  ctx.beginPath(); ctx.moveTo(WALL_T, dangerY); ctx.lineTo(CW - WALL_T, dangerY); ctx.stroke();
  ctx.restore();

  // Guide line under preview
  if (!gameOver && previewBody) {
    const gx     = previewBody.position.x;
    const guideY = CH * DROP_FRAC + scaledR(nextLevel) + 3;
    ctx.save();
    ctx.setLineDash([4, 5]);
    ctx.strokeStyle = 'rgba(255,255,255,.22)';
    ctx.lineWidth   = 1.5;
    ctx.beginPath(); ctx.moveTo(gx, guideY); ctx.lineTo(gx, CH - WALL_T); ctx.stroke();
    ctx.restore();
  }

  // ── Fruits ──────────────────────────────────────────
  const all = [...fruits.map(f => ({ body:f.body, lvl:f.level, a:1 }))];
  if (previewBody?._lvl !== undefined) {
    all.push({ body:previewBody, lvl:previewBody._lvl, a:0.68 });
  }

  for (const { body, lvl, a } of all) {
    const { x, y } = body.position;
    const r = scaledR(lvl);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(x, y);
    ctx.rotate(body.angle);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();

    const im = imgCache[lvl];
    if (im && im.complete && im.naturalWidth > 0) {
      ctx.drawImage(im, -r, -r, r * 2, r * 2);
    } else {
      ctx.fillStyle = FRUITS[lvl].color; ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.round(r * .82)}px Helvetica, Arial, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(lvl + 1, 0, 0);
    }
    ctx.restore();

    // rim glow
    ctx.save();
    ctx.globalAlpha = a * 0.30;
    ctx.translate(x, y);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.restore();
  }

  // ── Particles ────────────────────────────────────────
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.1;
    p.life -= p.decay;
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle   = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * Math.max(0, p.life), 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

/* ══════════════════════════════════════════════════════
   GAME-OVER CHECK
   Triggered when any fruit's TOP EDGE (not centre)
   is above the danger line and it is nearly still.
══════════════════════════════════════════════════════ */
function checkGameOver() {
  const dangerY = CH * DANGER_FRAC;
  for (const { body } of fruits) {
    if (body._merging) continue;
    const topEdge = body.position.y - scaledR(body._lvl);
    const speed   = Math.hypot(body.velocity.x, body.velocity.y);
    if (topEdge < dangerY && speed < 0.5) {
      triggerGameOver(); return;
    }
  }
}

function triggerGameOver() {
  if (gameOver) return;
  gameOver = true; canDrop = false;
  if (runner) Runner.stop(runner);

  document.getElementById('oScore').textContent = `Score: ${score}`;
  const isNew = score > 0 && score >= best;
  document.getElementById('oBest').style.display = isNew ? 'block' : 'none';

  clearTimeout(goTimer);
  goTimer = setTimeout(() => document.getElementById('overlay').classList.add('on'), 700);
}

/* ══════════════════════════════════════════════════════
   MAIN LOOP
══════════════════════════════════════════════════════ */
function loop() {
  rafId = requestAnimationFrame(loop);
  draw();
  if (!gameOver) checkGameOver();
}

/* ══════════════════════════════════════════════════════
   START / STOP
══════════════════════════════════════════════════════ */
function stopGame() {
  if (runner) { Runner.stop(runner); runner = null; }
  if (engine) { Engine.clear(engine); engine = null; world = null; }
  if (rafId)  { cancelAnimationFrame(rafId); rafId = null; }
  clearTimeout(goTimer);
}

function startGame() {
  stopGame();

  fruits=[]; particles=[]; previewBody=null;
  score=0; canDrop=true; midDrop=false; gameOver=false;
  document.getElementById('sScore').textContent = 0;
  document.getElementById('sBest').textContent  = best;
  document.getElementById('overlay').classList.remove('on');

  resizeCanvas();
  dropX = CW / 2;

  engine = Engine.create({
    gravity: { x:0, y:1.8 },
    positionIterations: 10,
    velocityIterations: 8,
  });
  world  = engine.world;
  runner = Runner.create({ delta:1000/60, isFixed:true });

  buildWalls();
  Events.on(engine, 'collisionStart', onCollision);
  Runner.run(runner, engine);

  nextLevel   = pickLevel();
  previewBody = makeBody(dropX, CH * DROP_FRAC, nextLevel, true);

  rafId = requestAnimationFrame(loop);
}

/* ══════════════════════════════════════════════════════
   RESIZE
══════════════════════════════════════════════════════ */
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (!document.getElementById('game').classList.contains('hidden')) startGame();
  }, 150);
});

/* ══════════════════════════════════════════════════════
   BOOT
══════════════════════════════════════════════════════ */
loadImages().then(() => {
  buildSplash();
  document.getElementById('sBest').textContent = best;
});
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
