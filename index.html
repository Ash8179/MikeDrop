<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mike Drop">
<meta name="theme-color" content="#f5c842">
<link rel="manifest" href="manifest.json">
<title>Mike Drop</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:     #fdf3c8;
  --wall:   rgba(232,168,56,.7);
  --walledge: #c07820;
  --txt:    #7a2800;
  --gold:   #e8900a;
  --shadow: rgba(120,60,0,.16);
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* ── Layout ──────────────────────────────────────────────────── */
#app {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: linear-gradient(180deg, #fdf3c8 0%, #fde98a 100%);
}

/* ── HUD ─────────────────────────────────────────────────────── */
#hud {
  flex-shrink: 0;
  display: flex; gap: 10px;
  padding: 8px 14px 6px;
}
.hud-box {
  flex: 1;
  background: rgba(255,255,255,.72);
  border-radius: 14px; padding: 7px 14px;
  box-shadow: 0 2px 8px var(--shadow);
}
.hud-label {
  font-size: 9px; font-weight: 800; letter-spacing: 2.5px;
  color: rgba(120,60,0,.5); margin-bottom: 1px;
}
.hud-val {
  font-size: 26px; font-weight: 900; color: var(--txt); line-height: 1;
}
.hud-val.gold { color: var(--gold); }
.hud-val.pop  { animation: scorePop .22s ease; }
@keyframes scorePop { 0%,100%{transform:scale(1)} 50%{transform:scale(1.28)} }

/* NEXT box */
#next-box {
  position: absolute; top: env(safe-area-inset-top,0px); right: 14px;
  background: rgba(255,255,255,.72);
  border-radius: 0 0 14px 14px;
  padding: 4px 10px 8px;
  display: flex; flex-direction: column; align-items: center;
  box-shadow: 0 2px 8px var(--shadow);
  pointer-events: none; z-index: 5;
}
#next-label { font-size: 9px; font-weight: 800; letter-spacing: 2px; color: rgba(120,60,0,.5); }
#next-img   { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; margin-top: 4px; }

/* ── Canvas ──────────────────────────────────────────────────── */
#canvas-wrap {
  flex: 1; min-height: 0;
  padding: 0 12px 10px;
  display: flex;
}
#c {
  flex: 1;
  border-radius: 20px;
  box-shadow: 0 6px 28px var(--shadow);
  display: block;
  touch-action: none;
}

/* ── Game-over overlay ───────────────────────────────────────── */
#overlay {
  position: absolute; inset: 0; z-index: 20;
  background: rgba(30,8,0,.56);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity .3s ease;
}
#overlay.on { opacity: 1; pointer-events: all; }
.card {
  background: rgba(70,16,3,.95);
  border-radius: 28px; padding: 36px 32px;
  text-align: center; color: #fff;
  width: min(320px, 88vw);
  box-shadow: 0 16px 48px rgba(0,0,0,.5);
  transform: scale(.88);
  transition: transform .35s cubic-bezier(.34,1.56,.64,1);
}
#overlay.on .card { transform: scale(1); }
.card-melon  { font-size: 58px; }
.card-title  { font-size: 28px; font-weight: 900; letter-spacing: 2px; margin-top: 6px; }
.card-score  { font-size: 21px; font-weight: 700; color: #fbc84a; margin-top: 6px; }
.card-best   {
  display: none;
  font-size: 12px; font-weight: 700; color: #ffd700;
  background: rgba(255,255,255,.15); border-radius: 20px;
  padding: 3px 14px; margin-top: 8px;
}
.btn {
  width: 100%; padding: 15px 0; border: none; border-radius: 14px;
  font-size: 17px; font-weight: 900; letter-spacing: 2px; cursor: pointer;
  transition: transform .12s;
}
.btn:active { transform: scale(.95); }
.btn-primary {
  margin-top: 24px;
  background: linear-gradient(135deg,#e84b10,#a81800);
  color: #fff;
  box-shadow: 0 6px 18px rgba(180,30,0,.5);
}
</style>
</head>
<body>

<div id="app">
  <div id="hud">
    <div class="hud-box">
      <div class="hud-label">SCORE</div>
      <div class="hud-val" id="sScore">0</div>
    </div>
    <div class="hud-box" style="text-align:right">
      <div class="hud-label">BEST</div>
      <div class="hud-val gold" id="sBest">0</div>
    </div>
  </div>
  <div id="canvas-wrap"><canvas id="c"></canvas></div>
</div>

<div id="next-box">
  <div id="next-label">NEXT</div>
  <img id="next-img" src="" alt="">
</div>

<div id="overlay">
  <div class="card">
    <div class="card-melon">Huh?</div>
    <div class="card-title">GAME OVER</div>
    <div class="card-score" id="oScore">Score: 0</div>
    <div class="card-best"  id="oBest">🏆 NEW BEST!</div>
    <button class="btn btn-primary" id="btnRetry">New Game</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
'use strict';

/* ═══════════════════════════════════════════════════════
   FRUIT TABLE
   r   = base radius at 390px canvas width
   density = realistic relative weight (bigger = heavier,
             scales roughly with r³ like real fruit mass)
═══════════════════════════════════════════════════════ */
const FRUITS = [
  { name:'McCherry',      r:20,  density:0.00060, color:'#f26c6c', img:'1'  },
  { name:'McStrawberry',  r:28,  density:0.00090, color:'#e03055', img:'2'  },
  { name:'McGrape',       r:37,  density:0.00130, color:'#8b3fa8', img:'3'  },
  { name:'McOrange',      r:47,  density:0.00185, color:'#ff8800', img:'4'  },
  { name:'McLemon',       r:56,  density:0.00250, color:'#ffd700', img:'5'  },
  { name:'McApple',       r:66,  density:0.00340, color:'#e51c1c', img:'6'  },
  { name:'McPear',        r:76,  density:0.00450, color:'#8db828', img:'7'  },
  { name:'McPeach',       r:87,  density:0.00590, color:'#ff9966', img:'8'  },
  { name:'McPineapple',   r:99,  density:0.00760, color:'#f5c518', img:'9'  },
  { name:'McCoconut',     r:112, density:0.00970, color:'#8B4513', img:'10' },
  { name:'McWatermelon',  r:128, density:0.01200, color:'#3aab3a', img:'11' },
];

const SCORE_PER_MERGE = [1,3,6,10,15,21,28,36,45,55,100];
// Only levels 0-4 can be dropped
const DROP_WEIGHTS    = [35,28,20,12,5];

const BASE_W = 390;   // radius reference width
const WALL_T = 15;    // wall thickness px (visual + physics)
const DROP_FRAC   = 0.13;  // drop-line: fraction from canvas top
const DANGER_FRAC = 0.16;  // game-over line: fraction from canvas top

/* ═══════════════════════════════════════════════════════
   IMAGE LOADER  — tries png / PNG / jpg / JPG / jpeg
═══════════════════════════════════════════════════════ */
const imgCache = new Array(FRUITS.length).fill(null);

function tryLoadImage(fruit, index, exts, resolve) {
  if (!exts.length) { resolve(); return; }
  const src = `images/${fruit.img}.${exts[0]}`;
  const im  = new Image();
  im.onload  = () => { imgCache[index] = im; resolve(); };
  im.onerror = () => tryLoadImage(fruit, index, exts.slice(1), resolve);
  im.src = src;
}

function loadAllImages() {
  const exts = ['png','PNG','jpg','JPG','jpeg','JPEG'];
  return Promise.all(
    FRUITS.map((f, i) => new Promise(res => tryLoadImage(f, i, exts, res)))
  );
}

/* ═══════════════════════════════════════════════════════
   MATTER.JS ALIASES
═══════════════════════════════════════════════════════ */
const { Engine, Runner, Bodies, Body, World, Events, Vector } = Matter;

/* ═══════════════════════════════════════════════════════
   CANVAS SETUP
═══════════════════════════════════════════════════════ */
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let CW, CH, scale;

function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  // Use device pixel ratio for crisp rendering on retina
  const dpr  = window.devicePixelRatio || 1;
  const cssW = wrap.clientWidth  - 24;
  const cssH = wrap.clientHeight - 10;
  canvas.style.width  = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width  = cssW * dpr;
  canvas.height = cssH * dpr;
  ctx.scale(dpr, dpr);
  CW    = cssW;
  CH    = cssH;
  scale = CW / BASE_W;
}

function scaledR(level) {
  return FRUITS[Math.min(level, FRUITS.length-1)].r * scale;
}

/* ═══════════════════════════════════════════════════════
   PHYSICS ENGINE
═══════════════════════════════════════════════════════ */
let engine, world, runner;
let fruits      = [];   // { body, level }
let particles   = [];
let previewBody = null;
let nextLevel   = 0;
let dropX       = 0;
let score       = 0;
let best        = +localStorage.getItem('mgBest') || 0;
let canDrop     = true;
let midDrop     = false;
let gameOver    = false;
let rafId       = null;
let gameOverTimer = null;

function pickNextLevel() {
  const pool = [];
  DROP_WEIGHTS.forEach((w,i) => { for(let j=0;j<w;j++) pool.push(i); });
  return pool[Math.floor(Math.random() * pool.length)];
}

/* ── Spawn a physics circle ──────────────────────────── */
function makeFruitBody(x, y, level, isPreview) {
  const f   = FRUITS[Math.min(level, FRUITS.length-1)];
  const r   = f.r * scale;

  /*  Use exact circle radius * 0.98 so fruits don't visually overlap
      before the physics engine resolves the collision.
      Matter.js circle bodies ARE perfect circles — no vertex approximation
      needed when using Bodies.circle() with a reasonable slop.           */
  const body = Bodies.circle(x, y, r * 0.98, {
    restitution : 0.10,   // slight bounce — like real fruit
    friction    : 0.60,   // high surface friction → less sliding
    frictionAir : 0.006,  // gentle air drag, not floaty
    density     : f.density,   // heavier fruits have larger density
    label       : `fruit`,
    isStatic    : isPreview,
    slop        : 0.02,   // small overlap tolerance for stable stacking
    collisionFilter: isPreview
      ? { category:0x0002, mask:0x0000 }   // preview: no collisions
      : { category:0x0001, mask:0x0001|0x0002_but_actually_walls },
  });
  // simpler filter (Matter.js uses numeric masks)
  body.collisionFilter = isPreview
    ? { category:0x0002, mask:0x0000 }
    : { category:0x0001, mask:0x0001|0x0004 };

  body._level   = level;
  body._merging = false;
  World.add(world, body);
  return body;
}

/* ── Static walls ────────────────────────────────────── */
function buildWalls() {
  const wallOpts = {
    isStatic    : true,
    restitution : 0.05,
    friction    : 0.60,
    collisionFilter: { category:0x0004, mask:0x0001 },
  };
  // Floor sits just below the visible area
  const floor = Bodies.rectangle(CW/2, CH + WALL_T/2,      CW + WALL_T*2, WALL_T, wallOpts);
  // Left & right walls extend well above the canvas
  const left  = Bodies.rectangle(-WALL_T/2,  CH/2, WALL_T, CH*3, wallOpts);
  const right = Bodies.rectangle(CW+WALL_T/2, CH/2, WALL_T, CH*3, wallOpts);
  World.add(world, [floor, left, right]);
}

/* ── Collision → merge ───────────────────────────────── */
function onCollision(evt) {
  if (gameOver) return;
  for (const pair of evt.pairs) {
    const a = pair.bodyA, b = pair.bodyB;
    if (a._level === undefined || b._level === undefined) continue;
    if (a._level !== b._level) continue;
    if (a._merging || b._merging) continue;
    a._merging = b._merging = true;

    const lvl = a._level;
    const mx  = (a.position.x + b.position.x) / 2;
    const my  = (a.position.y + b.position.y) / 2;

    setTimeout(() => {
      if (!world) return;
      World.remove(world, [a, b]);
      fruits = fruits.filter(f => f.body !== a && f.body !== b);

      burstParticles(mx, my, lvl);
      addScore(SCORE_PER_MERGE[Math.min(lvl, SCORE_PER_MERGE.length-1)]);

      if (lvl >= FRUITS.length - 1) return;  // max level — just remove

      const nb = makeFruitBody(mx, my, lvl + 1, false);
      fruits.push({ body:nb, level:lvl+1 });

      // small upward pop so the merged fruit doesn't instantly squash into the pile
      const rNew = FRUITS[lvl+1].r * scale;
      Body.applyForce(nb, nb.position, {
        x: (Math.random()-0.5) * rNew * 0.0003,
        y: -rNew * 0.0008,
      });
    }, 35);
  }
}

/* ── Drop ────────────────────────────────────────────── */
function clampDropX(x) {
  const r = scaledR(nextLevel);
  return Math.max(WALL_T + r + 1, Math.min(CW - WALL_T - r - 1, x));
}

function doDrop(canvasX) {
  if (gameOver || !canDrop || midDrop) return;
  midDrop = true;
  canDrop = false;

  const x   = clampDropX(canvasX);
  const lvl = nextLevel;

  if (previewBody) { World.remove(world, previewBody); previewBody = null; }

  const nb = makeFruitBody(x, CH * DROP_FRAC, lvl, false);
  fruits.push({ body:nb, level:lvl });

  // downward nudge proportional to radius so it falls immediately
  Body.applyForce(nb, nb.position, { x:0, y: FRUITS[lvl].r * scale * 0.0025 });

  nextLevel = pickNextLevel();
  updateNextUI();

  setTimeout(() => {
    if (!world) return;
    previewBody = makeFruitBody(clampDropX(dropX), CH * DROP_FRAC, nextLevel, true);
    canDrop = true; midDrop = false;
  }, 600);
}

/* ── Input ───────────────────────────────────────────── */
function canvasX(clientX) {
  const rect = canvas.getBoundingClientRect();
  return (clientX - rect.left) * (CW / rect.width);
}

function onMove(clientX) {
  if (gameOver || midDrop) return;
  dropX = clampDropX(canvasX(clientX));
  if (previewBody) Body.setPosition(previewBody, { x:dropX, y:CH*DROP_FRAC });
}

canvas.addEventListener('touchmove',  e => { e.preventDefault(); onMove(e.touches[0].clientX); }, {passive:false});
canvas.addEventListener('touchend',   e => { e.preventDefault(); doDrop(canvasX(e.changedTouches[0].clientX)); }, {passive:false});
canvas.addEventListener('mousemove',  e => onMove(e.clientX));
canvas.addEventListener('click',      e => doDrop(canvasX(e.clientX)));

/* ═══════════════════════════════════════════════════════
   PARTICLES
═══════════════════════════════════════════════════════ */
function burstParticles(x, y, level) {
  const n = 10 + level * 2;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 1 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      r : 2.5 + Math.random()*4,
      life:1,
      decay: 0.028 + Math.random()*0.025,
      color: ['#ffd700','#ff8800','#ff4400'][Math.floor(Math.random()*3)],
    });
  }
}

/* ═══════════════════════════════════════════════════════
   HUD
═══════════════════════════════════════════════════════ */
function updateNextUI() {
  const im = document.getElementById('next-img');
  const cached = imgCache[nextLevel];
  if (cached) im.src = cached.src;
  else im.src = '';
}

function addScore(pts) {
  score += pts;
  if (score > best) { best = score; localStorage.setItem('mgBest', best); }
  document.getElementById('sScore').textContent = score;
  document.getElementById('sBest').textContent  = best;
  const el = document.getElementById('sScore');
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
}

/* ═══════════════════════════════════════════════════════
   DRAW
═══════════════════════════════════════════════════════ */
function draw() {
  ctx.clearRect(0, 0, CW, CH);

  // Background
  ctx.fillStyle = '#fef8e4';
  ctx.beginPath();
  ctx.roundRect(0, 0, CW, CH, 20);
  ctx.fill();

  // Walls (visual)
  ctx.fillStyle   = 'rgba(232,168,56,.68)';
  ctx.strokeStyle = '#c07820';
  ctx.lineWidth   = 1.5;
  // left wall
  ctx.beginPath(); ctx.roundRect(0, 0, WALL_T, CH, [0,0,6,6]); ctx.fill(); ctx.stroke();
  // right wall
  ctx.beginPath(); ctx.roundRect(CW-WALL_T, 0, WALL_T, CH, [0,0,6,6]); ctx.fill(); ctx.stroke();
  // floor
  ctx.beginPath(); ctx.roundRect(WALL_T, CH-WALL_T, CW-WALL_T*2, WALL_T, 4); ctx.fill(); ctx.stroke();

  // Danger line
  const dangerY = CH * DANGER_FRAC;
  ctx.save();
  ctx.setLineDash([7,5]);
  ctx.strokeStyle = 'rgba(214,48,49,.4)';
  ctx.lineWidth   = 1.8;
  ctx.beginPath(); ctx.moveTo(WALL_T, dangerY); ctx.lineTo(CW-WALL_T, dangerY); ctx.stroke();
  ctx.restore();

  // Guide line below preview
  if (!gameOver && previewBody) {
    const gx = previewBody.position.x;
    ctx.save();
    ctx.setLineDash([4,5]);
    ctx.strokeStyle = 'rgba(255,255,255,.25)';
    ctx.lineWidth   = 1.5;
    ctx.beginPath(); ctx.moveTo(gx, CH*DROP_FRAC + scaledR(nextLevel) + 2); ctx.lineTo(gx, CH-WALL_T);
    ctx.stroke();
    ctx.restore();
  }

  // Fruits
  const toDraw = [...fruits.map(f=>({body:f.body,level:f.level,alpha:1}))];
  if (previewBody?._level !== undefined) {
    toDraw.push({ body:previewBody, level:previewBody._level, alpha:0.70 });
  }

  for (const { body, level, alpha } of toDraw) {
    const { x, y } = body.position;
    const r   = scaledR(level);
    const ang = body.angle;
    const im  = imgCache[level];

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.rotate(ang);

    // circle clip
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.clip();

    if (im && im.complete && im.naturalWidth > 0) {
      ctx.drawImage(im, -r, -r, r*2, r*2);
    } else {
      // Fallback: solid colour + number
      ctx.fillStyle = FRUITS[level].color;
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.round(r*.85)}px Helvetica`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(level+1, 0, 0);
    }

    // rim
    ctx.restore();
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = alpha * 0.35;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.restore();
  }

  // Particles
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.09;
    p.life -= p.decay;
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

/* ═══════════════════════════════════════════════════════
   GAME-OVER CHECK
   A fruit triggers game over when its top edge is above
   the danger line AND it has nearly stopped moving.
═══════════════════════════════════════════════════════ */
const STILL_SPEED = 0.4;

function checkGameOver() {
  const dangerY = CH * DANGER_FRAC;
  for (const { body } of fruits) {
    if (body._merging) continue;
    const top   = body.position.y - scaledR(body._level);
    const speed = Math.hypot(body.velocity.x, body.velocity.y);
    if (top < dangerY && speed < STILL_SPEED) {
      triggerGameOver(); return;
    }
  }
}

function triggerGameOver() {
  if (gameOver) return;
  gameOver = true; canDrop = false;
  if (runner) Runner.stop(runner);

  const isNew = score > 0 && score >= best;
  document.getElementById('oScore').textContent = `Score: ${score}`;
  document.getElementById('oBest').style.display = isNew ? 'block' : 'none';

  if (gameOverTimer) clearTimeout(gameOverTimer);
  gameOverTimer = setTimeout(() => {
    document.getElementById('overlay').classList.add('on');
  }, 700);
}

/* ═══════════════════════════════════════════════════════
   GAME LOOP
═══════════════════════════════════════════════════════ */
function loop() {
  rafId = requestAnimationFrame(loop);
  draw();
  if (!gameOver) checkGameOver();
}

/* ═══════════════════════════════════════════════════════
   START / RESTART
═══════════════════════════════════════════════════════ */
function startGame() {
  // tear down
  if (runner) { Runner.stop(runner); runner = null; }
  if (engine) { Engine.clear(engine); engine = null; world = null; }
  if (rafId)  { cancelAnimationFrame(rafId); rafId = null; }
  if (gameOverTimer) { clearTimeout(gameOverTimer); gameOverTimer = null; }
  document.getElementById('overlay').classList.remove('on');

  // reset state
  fruits=[]; particles=[]; previewBody=null;
  score=0; canDrop=true; midDrop=false; gameOver=false;
  document.getElementById('sScore').textContent = 0;
  document.getElementById('sBest').textContent  = best;

  resizeCanvas();
  dropX = CW / 2;

  // physics world — gravity tuned so large fruits fall crisply
  engine = Engine.create({ gravity:{ x:0, y:1.8 }, positionIterations:10, velocityIterations:8 });
  world  = engine.world;
  runner = Runner.create({ delta:1000/60, isFixed:true });

  buildWalls();
  Events.on(engine, 'collisionStart', onCollision);
  Runner.run(runner, engine);

  nextLevel   = pickNextLevel();
  dropX       = CW / 2;
  previewBody = makeFruitBody(dropX, CH*DROP_FRAC, nextLevel, true);
  updateNextUI();

  rafId = requestAnimationFrame(loop);
}

document.getElementById('btnRetry').addEventListener('click', startGame);

window.addEventListener('resize', () => {
  // Small debounce to avoid thrashing during animation
  clearTimeout(window._resizeTimer);
  window._resizeTimer = setTimeout(startGame, 120);
});

/* ═══════════════════════════════════════════════════════
   BOOT — load images first, then start immediately
═══════════════════════════════════════════════════════ */
loadAllImages().then(() => {
  startGame();
});
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
